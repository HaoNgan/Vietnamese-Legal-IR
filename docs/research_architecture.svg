<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">Quy trình tìm văn bản pháp luật</title>
  <desc id="desc">Corpus được chia đoạn và lập chỉ mục cho hai cách tìm: BM25 theo từ khóa và BGE-M3 với FAISS theo ý nghĩa. Câu hỏi đi qua hai nhánh truy xuất, kết quả được hợp nhất, xếp hạng lại bằng Cross-Encoder và trả về Top-10 văn bản liên quan.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0 0 L10 4.5 L0 9 Z" fill="#303b42"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #263238; }
      .title { font-size: 25px; font-weight: 600; }
      .section { font-size: 17px; font-weight: 600; }
      .name { font-size: 16px; font-weight: 600; }
      .detail { font-size: 14px; }
      .box { fill: #fff; stroke: #687780; stroke-width: 1.5; }
      .soft { fill: #f6f7f6; stroke: #687780; stroke-width: 1.5; }
      .arrow { fill: none; stroke: #303b42; stroke-width: 1.8; marker-end: url(#arrow); stroke-linecap: square; stroke-linejoin: round; }
      .line { fill: none; stroke: #303b42; stroke-width: 1.8; stroke-linecap: square; stroke-linejoin: round; }
    </style>
  </defs>
  <rect width="1600" height="700" fill="#fff"/>

  <text x="800" y="42" text-anchor="middle" class="title">Quy trình tìm văn bản pháp luật</text>
  <text x="55" y="82" class="section">Chuẩn bị văn bản</text>

  <rect x="55" y="110" width="230" height="92" rx="7" class="soft"/>
  <text x="170" y="146" text-anchor="middle" class="name">Corpus văn bản pháp luật</text>
  <text x="170" y="176" text-anchor="middle" class="detail">Zalo 2021 · 61.425 văn bản</text>

  <rect x="335" y="110" width="270" height="92" rx="7" class="box"/>
  <text x="470" y="146" text-anchor="middle" class="name">Tiền xử lý</text>
  <text x="470" y="176" text-anchor="middle" class="detail">Chia đoạn 400 từ, chồng lắp 50 từ</text>

  <rect x="760" y="78" width="280" height="86" rx="7" class="soft"/>
  <text x="900" y="113" text-anchor="middle" class="name">BM25 Index</text>
  <text x="900" y="141" text-anchor="middle" class="detail">Truy xuất theo từ khóa</text>

  <rect x="760" y="205" width="320" height="86" rx="7" class="soft"/>
  <text x="920" y="240" text-anchor="middle" class="name">BGE-M3 Encoder + FAISS</text>
  <text x="920" y="268" text-anchor="middle" class="detail">Vector hóa và lập chỉ mục</text>

  <path class="arrow" d="M285 156 H335"/>
  <path class="arrow" d="M605 156 H685 V121 H760"/>
  <path class="arrow" d="M685 156 V248 H760"/>

  <text x="55" y="348" class="section">Khi người dùng đặt câu hỏi</text>

  <rect x="55" y="425" width="230" height="96" rx="7" class="soft"/>
  <text x="170" y="481" text-anchor="middle" class="name">Câu hỏi tiếng Việt</text>

  <rect x="390" y="365" width="290" height="90" rx="7" class="soft"/>
  <text x="535" y="400" text-anchor="middle" class="name">BM25 Retrieval</text>
  <text x="535" y="428" text-anchor="middle" class="detail">Dùng chỉ mục BM25</text>

  <rect x="390" y="510" width="290" height="90" rx="7" class="soft"/>
  <text x="535" y="545" text-anchor="middle" class="name">Dense Retrieval</text>
  <text x="535" y="573" text-anchor="middle" class="detail">Dùng BGE-M3 + FAISS</text>

  <rect x="800" y="425" width="220" height="120" rx="7" class="box"/>
  <text x="910" y="460" text-anchor="middle" class="name">Hợp nhất kết quả</text>
  <text x="910" y="490" text-anchor="middle" class="detail">product_rank</text>
  <text x="910" y="518" text-anchor="middle" class="detail">Giữ Top-100</text>

  <rect x="1080" y="425" width="240" height="120" rx="7" class="soft"/>
  <text x="1200" y="475" text-anchor="middle" class="name">Cross-Encoder</text>
  <text x="1200" y="505" text-anchor="middle" class="detail">Xếp hạng lại ứng viên</text>

  <rect x="1360" y="425" width="220" height="120" rx="7" class="box"/>
  <text x="1470" y="460" text-anchor="middle" class="name">Top-10 văn bản liên quan</text>
  <text x="1470" y="490" text-anchor="middle" class="detail">Điều/Khoản · trích đoạn</text>
  <text x="1470" y="518" text-anchor="middle" class="detail">Nguồn văn bản</text>

  <!-- Câu hỏi tách thành hai nhánh ngắn -->
  <path class="line" d="M285 473 H335 V410"/>
  <path class="arrow" d="M335 410 H390"/>
  <path class="arrow" d="M335 473 V555 H390"/>

  <!-- Hai danh sách ứng viên được gộp trước khi xếp hạng lại -->
  <path class="arrow" d="M680 410 H750 V465 H800"/>
  <path class="arrow" d="M680 555 H750 V510 H800"/>
  <path class="arrow" d="M1020 485 H1080"/>
  <path class="arrow" d="M1320 485 H1360"/>
</svg>
